<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="bootstrap-5.3.8-dist/css/bootstrap.css" />
    <link rel="stylesheet" href="style.css" />
    <title>Login</title>
  </head>
  <body>
    <div class="">
      <div class="row">
        <!-- Left Side: Image -->
        <div class="col-md-5" style="padding: 0;">
          <div class="welcome-section">
            <h2>Welcome to Bloom & Joy</h2>
            <p>Your favorite flower shop is just a click away.</p>
          </div>
        </div>

        <!-- Right Side: Login Form -->
        <div class="col-md-7" style="padding: 0;">
          <div class="login-section">
            <!-- Tabs -->
            <div class="tabs">
              <button id="login-tab" class="active">Login</button>
              <button id="signup-tab">Sign Up</button>
            </div>

            <!-- Login Section -->

            <form id="login-form" class="form-section" action="" method="post">
              <h2>Welcome Back!</h2>
              <p>Login to your account</p>

              <div class="mb-3">
                <label for="login-email" class="form-label">
                  Email Address
                </label>
                <input
                  type="email"
                  id="login-email"
                  name="email"
                  class="form-control"
                  placeholder="Enter your email"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="login-password" class="form-label">
                  Password
                </label>
                <input
                  type="password"
                  id="login-password"
                  name="password"
                  class="form-control"
                  placeholder="Enter your password"
                  required
                />
              </div>

              <div class="form-check mb-3">
                <input
                  type="checkbox"
                  id="remember"
                  name="remember"
                  class="form-check-input"
                />
                <label for="remember" class="form-check-label">
                  Remember me
                </label>
              </div>

              <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>
            

            <!-- Sign Up Section -->
            <form id="signup-form" class="form-section" action="" method="post">
              <h2>Create Account</h2>
              <p>Join Bloom &amp; Joy</p>

              <div class="mb-3">
                <label for="signup-name" class="form-label"> Full Name </label>
                <input
                  type="text"
                  id="signup-name"
                  name="name"
                  class="form-control"
                  placeholder="Enter your full name"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="signup-email" class="form-label">
                  Email Address
                </label>
                <input
                  type="email"
                  id="signup-email"
                  name="email"
                  class="form-control"
                  placeholder="Enter your email"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="signup-password" class="form-label">
                  Password
                </label>
                <input
                  type="password"
                  id="signup-password"
                  name="password"
                  class="form-control"
                  placeholder="Create a password"
                  minlength="8"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="confirm-password" class="form-label">
                  Confirm Password
                </label>
                <input
                  type="password"
                  id="confirm-password"
                  name="confirm_password"
                  class="form-control"
                  placeholder="Confirm your password"
                  minlength="8"
                  required
                />
              </div>

              <button type="submit" class="btn btn-primary w-100">
                Sign Up
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script src="bootstrap-5.3.8-dist/js/bootstrap.bundle.js"></script>
    <script src="script.js"></script>
  </body>
</html>
